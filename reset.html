<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ניקוי מודע</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f7faf8;
        color: #10253f;
        font-family: "Heebo", "Assistant", "Segoe UI", Arial, sans-serif;
      }
      main {
        max-width: 430px;
        width: 100%;
        padding: 24px;
        border-radius: 24px;
        background: white;
        box-shadow: 0 22px 60px rgba(16, 37, 63, 0.14);
      }
      h1 { margin-top: 0; }
      p { line-height: 1.55; color: #6b7a90; }
      a {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        min-height: 48px;
        padding: 0 18px;
        border-radius: 14px;
        background: #153e67;
        color: white;
        font-weight: 900;
        text-decoration: none;
      }
      #status { color: #18b985; font-weight: 800; }
    </style>
  </head>
  <body>
    <main>
      <h1>מנקה גרסה ישנה</h1>
      <p id="status">מתחיל ניקוי...</p>
      <p>הדף הזה מוחק Service Worker ו-cache ישן של האפליקציה כדי שהאייפון יטען את גרסת Gmail האמיתית.</p>
      <a href="./index.html?v=5">פתח את מודע מחדש</a>
    </main>
    <script>
      async function resetApp() {
        const status = document.querySelector("#status");
        try {
          localStorage.clear();
          sessionStorage.clear();
          if ("caches" in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map((key) => caches.delete(key)));
          }
          if ("serviceWorker" in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }
          status.textContent = "הניקוי הושלם. עכשיו פתח את האפליקציה מחדש.";
        } catch {
          status.textContent = "הניקוי נתקל בשגיאה, אבל אפשר לנסות לפתוח מחדש.";
        }
      }
      resetApp();
    </script>
  </body>
</html>
